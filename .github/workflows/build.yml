name: Build GYSTC Dashboard

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default. Only the release job -- the one that actually
# creates the GitHub release -- gets write, so the reusable test workflow and
# the PyInstaller build run third-party actions with a read-only token.
permissions:
  contents: read

jobs:
  # The release gate: the same suite that guards pull requests also guards the
  # artifacts. Without this a tag on a red tree still shipped binaries.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: gystc-windows
          - os: macos-latest
            artifact: gystc-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Install the project itself, not a hand-written list of GUI packages.
      # The old list omitted faiss, mcp, sentence-transformers, watchdog, psutil
      # and httpx, so the shipped binary answered every search with
      # "No module named 'faiss'" while the build stayed green.
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dashboard]" pyinstaller

      # The app must work with no network at all, so the model travels inside
      # the bundle. This is the only step that is allowed online.
      - name: Bundle the embedding model
        run: python scripts/bundle_model.py

      - name: Generate macOS icon from SVG
        if: runner.os == 'macOS'
        run: |
          brew install imagemagick
          mkdir -p gystc-icon.iconset
          for size in 16 32 64 128 256 512; do
            magick assets/gystc-icon.svg -resize ${size}x${size} gystc-icon.iconset/icon_${size}x${size}.png
          done
          for size in 32 64 256 512 1024; do
            half=$((size / 2))
            magick assets/gystc-icon.svg -resize ${size}x${size} gystc-icon.iconset/icon_${half}x${half}@2x.png
          done
          iconutil -c icns gystc-icon.iconset -o assets/gystc-icon.icns
          echo "Generated .icns from SVG"
          ls -la assets/gystc-icon.icns

      - name: Build with PyInstaller
        run: pyinstaller gystc.spec --noconfirm

      - name: Verify build output
        shell: bash
        run: |
          ls -la dist/
          if [ -d "dist/GYSTC Dashboard.app" ]; then
            echo "macOS .app bundle found"
            ls -la "dist/GYSTC Dashboard.app/Contents/MacOS/" || true
            ls -la "dist/GYSTC Dashboard.app/Contents/Resources/" || true
          elif [ -d "dist/GYSTC Dashboard" ]; then
            echo "Windows dist found"
            ls -la "dist/GYSTC Dashboard/"
          fi

      # The real gate. A directory listing cannot tell whether the binary can
      # search; running it can. --selfcheck indexes a throwaway vault, embeds it
      # with the bundled model and retrieves it again -- no window, no network,
      # no access to the user's vault.
      - name: Smoke-test the built binary
        shell: bash
        timeout-minutes: 10
        run: |
          if [ -d "dist/GYSTC Dashboard.app" ]; then
            BIN="dist/GYSTC Dashboard.app/Contents/MacOS/GYSTC Dashboard"
          else
            BIN="dist/GYSTC Dashboard/GYSTC Dashboard.exe"
          fi
          set +e
          "$BIN" --selfcheck selfcheck.json
          status=$?
          set -e
          echo "--- selfcheck report ---"
          cat selfcheck.json || echo "(no report written)"
          if [ "$status" -ne 0 ]; then
            echo "::error::Built binary failed its self-check -- not shippable"
          fi
          exit $status

      - name: Create Windows ZIP
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd dist
          7z a -tzip "../${{ matrix.artifact }}.zip" "GYSTC Dashboard/"

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          create-dmg \
            --volname "GYSTC Dashboard" \
            --volicon "assets/gystc-icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "GYSTC Dashboard.app" 150 190 \
            --app-drop-link 450 190 \
            --hide-extension "GYSTC Dashboard.app" \
            --no-internet-enable \
            "${{ matrix.artifact }}.dmg" \
            "dist/GYSTC Dashboard.app" \
          || {
            echo "create-dmg failed, falling back to hdiutil"
            hdiutil create -volname "GYSTC Dashboard" -srcfolder "dist/GYSTC Dashboard.app" -ov -format UDZO "${{ matrix.artifact }}.dmg"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.dmg
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum gystc-windows/gystc-windows.zip | sed 's|gystc-windows/||' > SHA256SUMS.txt
          sha256sum gystc-macos/gystc-macos.dmg | sed 's|gystc-macos/||' >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/gystc-windows/gystc-windows.zip
            artifacts/gystc-macos/gystc-macos.dmg
            artifacts/SHA256SUMS.txt
