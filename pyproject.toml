[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gystc"
version = "1.3.5"
description = "Get Your Shit Together, Claude — persistent long-term memory via MCP"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    # Upper bounds block silent major upgrades of network-facing deps (defense
    # against supply-chain / breaking releases). Distributed binaries are the
    # CI-frozen PyInstaller build, which locks all transitive deps at build time.
    "mcp>=1.0,<2",
    "sentence-transformers>=2.2,<6",
    "faiss-cpu>=1.7.4,<2",
    "watchdog>=3.0,<5.0",
    "numpy>=1.24,<3",
    "psutil>=5.9,<8",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
dashboard = [
    "PyQt6",
    "PyQt6-WebEngine",
    "scipy",
    "requests",
]

[tool.setuptools.packages.find]
include = ["brain_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: spawns real daemon/proxy subprocesses (deselect with -m 'not slow')"]
