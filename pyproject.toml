[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gystc"
dynamic = ["version"]
description = "Get Your Shit Together, Claude — persistent long-term memory via MCP"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    # Upper bounds block silent major upgrades of network-facing deps (defense
    # against supply-chain / breaking releases). Distributed binaries are the
    # CI-frozen PyInstaller build, which locks all transitive deps at build time.
    "mcp>=1.0,<2",
    "sentence-transformers>=2.2,<6",
    "faiss-cpu>=1.7.4,<2",
    "watchdog>=3.0,<5.0",
    "numpy>=1.24,<3",
    "psutil>=5.9,<8",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.1",
]
dashboard = [
    "PyQt6",
    "PyQt6-WebEngine",
    "scipy",
    "requests",
]

# One version source: brain_mcp/__init__.py. It used to say 1.4.1 while this
# file said 1.4.3 and the macOS bundle said 1.0.0 -- three numbers for one
# artifact. Guarded by tests/test_release_bundle.py.
[tool.setuptools.dynamic]
version = {attr = "brain_mcp.__version__"}

[tool.setuptools.packages.find]
include = ["brain_mcp*"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["dist", "build", "brain/web/vendor"]

[tool.ruff.lint]
# Pinned so the finding count is a property of the repo, not of whoever runs it
# (the external review reported 250 findings from its own invocation).
# Deliberately NOT enabled:
#   BLE001 (blind except, 48x) - nearly all are documented decisions in recovery
#     paths; turning it on would mean 48 noqa comments, not 48 fixes.
#   I001 (import sorting) - would rewrite the import block of most files in the
#     repo for no behavioural gain.
#   PLW1510 (subprocess without check) - needs a per-call judgement, not a sweep.
# Correctness and dead code, not formatting: E701/E702 (statements joined by a
# colon or semicolon) and E402 are style, and this repo uses both deliberately in
# its CLI and test teardown.
select = ["E401", "E711", "E712", "E713", "E714", "E721", "E722", "E731",
          "E9", "F", "UP", "S110"]

[tool.ruff.lint.per-file-ignores]
# Best-effort teardown: closing the stdin of an already-dead process or killing a
# daemon that never started must not mask the failure the test actually found.
"tests/test_daemon_e2e.py" = ["S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Hang-guard: this codebase's bug history is dominated by hang classes, so a
# deadlocked test must fail loudly instead of freezing the suite forever.
timeout = 120
markers = ["slow: spawns real daemon/proxy subprocesses (deselect with -m 'not slow')"]
