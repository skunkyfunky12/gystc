[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gystc"
version = "1.3.3"
description = "Get Your Shit Together, Claude — persistent long-term memory via MCP"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7.4",
    "watchdog>=3.0,<5.0",
    "numpy>=1.24",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
dashboard = [
    "PyQt6",
    "PyQt6-WebEngine",
    "scipy",
    "requests",
]

[tool.setuptools.packages.find]
include = ["brain_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
