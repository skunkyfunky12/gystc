# SonarCloud (SonarQube Cloud) — Projekt-Konfiguration für gystc.
#
# QUELLEN UND TESTS SIND HIER AUSDRUECKLICH DISJUNKT.
# Die erste Fassung setzte `sonar.sources=.` UND `sonar.tests=tests`. Weil
# `tests/` unterhalb von `.` liegt, waren dieselben 68 Testdateien gleichzeitig
# Quelle und Test — Greptile hat das am PR nachgewiesen. Statt auf feinsinniges
# Verhalten des Scanners zu bauen, stehen die Quellordner jetzt einzeln da:
# was nicht aufgezaehlt ist, wird gar nicht erst indexiert.
#
# ZWEITER BEFUND, SCHWERER: `brain/**` und `data/**` standen in den Ausschluessen
# — das ist Anwendungscode (brain_layout, loader, regions, vault_loader). Die
# Analyse haette also ausgerechnet einen Teil des Kerns nicht angesehen.
sonar.projectKey=skunkyfunky12_gystc
sonar.organization=skunkyfunky12
sonar.python.version=3.11,3.12

# Anwendungscode. Nicht aufgefuehrt und damit bewusst draussen: assets/, docs/,
# dist/, build/, graphify-out/ (abgeleitet oder kein Code) sowie die beiden
# Einzelstuecke debug_launch.py und test_minimal_gl.py (Wegwerf-Hilfen).
sonar.sources=brain,brain_mcp,data,integrations,scripts,tools,main.py,setup_wizard.py

# Testcode. Liegt vollstaendig in einem eigenen Ordner — keine Ueberschneidung
# mit den Quellen oben, deshalb braucht es hier keine test.inclusions.
sonar.tests=tests

sonar.exclusions=**/__pycache__/**,**/*.html
