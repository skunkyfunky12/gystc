# SonarCloud / SonarQube Cloud config for gystc (public repo = free analysis).
#
# ACTIVATION (one-time, only you can do this - needs the sonarcloud.io account):
#   1. sonarcloud.io -> "+" -> "Analyze new project" -> pick skunkyfunky12/gystc.
#      The import screen shows the real projectKey + organization; if they differ
#      from the values below, adjust the two lines.
#   2. In the project: Administration -> Analysis Method -> turn OFF "Automatic
#      Analysis" (we analyze via GitHub Actions / CI instead - SonarCloud allows
#      only one method).
#   3. Create a token (My Account -> Security) and add it as the GitHub repo
#      secret SONAR_TOKEN (Settings -> Secrets and variables -> Actions).
#   Then the workflow scans on every push to master and on PRs.

sonar.projectKey=skunkyfunky12_gystc
sonar.organization=skunkyfunky12

sonar.sources=.
sonar.tests=tests
sonar.python.version=3.11,3.12

# Exclude non-source: build/dist artifacts, vault data, assets, docs, caches.
sonar.exclusions=dist/**,build/**,data/**,brain/**,assets/**,docs/**,graphify-out/**,**/__pycache__/**,**/*.html,**/*.spec,debug_launch.py,test_minimal_gl.py

# Coverage (optional, add later): run `pytest --cov=brain_mcp --cov-report=xml`
# in the workflow, then uncomment:
# sonar.python.coverage.reportPaths=coverage.xml
